name: Deploy Prod

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  STACK_NAME: legal-agents-prod
  ENVIRONMENT: prod

jobs:
  build:
    name: Build Images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f pipeline/docker/backend.Dockerfile -t $ECR_REGISTRY/${{ env.STACK_NAME }}-backend:$IMAGE_TAG -t $ECR_REGISTRY/${{ env.STACK_NAME }}-backend:latest .
          docker push $ECR_REGISTRY/${{ env.STACK_NAME }}-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.STACK_NAME }}-backend:latest

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f pipeline/docker/frontend.Dockerfile -t $ECR_REGISTRY/${{ env.STACK_NAME }}-frontend:$IMAGE_TAG -t $ECR_REGISTRY/${{ env.STACK_NAME }}-frontend:latest .
          docker push $ECR_REGISTRY/${{ env.STACK_NAME }}-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.STACK_NAME }}-frontend:latest

  deploy:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: build
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy backend Lambda
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.STACK_NAME }}-backend \
            --image-uri $ECR_REGISTRY/${{ env.STACK_NAME }}-backend:$IMAGE_TAG \
            --region ${{ env.AWS_REGION }}

      - name: Deploy frontend Lambda
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.STACK_NAME }}-frontend \
            --image-uri $ECR_REGISTRY/${{ env.STACK_NAME }}-frontend:$IMAGE_TAG \
            --region ${{ env.AWS_REGION }}

      - name: Wait for backend Lambda update
        run: |
          aws lambda wait function-updated-v2 \
            --function-name ${{ env.STACK_NAME }}-backend \
            --region ${{ env.AWS_REGION }}

      - name: Wait for frontend Lambda update
        run: |
          aws lambda wait function-updated-v2 \
            --function-name ${{ env.STACK_NAME }}-frontend \
            --region ${{ env.AWS_REGION }}

      - name: Deployment summary
        run: |
          echo "## Prod Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Stack:** ${{ env.STACK_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
